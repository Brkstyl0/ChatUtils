# Mute Mesajları
mute-usage: "&eKullanım: &6/mute <oyuncu> <süre> [sebep]\n&7Örnek: &f/mute Steve 30m Küfür\n&7Süre birimleri: &es (saniye), m (dakika), h (saat), d (gün) veya kalici"
unmute-usage: "&eKullanım: &6/unmute <oyuncu>"

mute-broadcast:
  - "&c&l[MUTE] &e{target}&7 adlı oyuncu &f{staff} &7tarafından &e{duration} &7susturuldu."
  - "&8» &7Sebep: &f{reason}"

unmute-broadcast:
  - "&a&l[UNMUTE] &e{target}&7 adlı oyuncunun susturması &f{staff} &7tarafından kaldırıldı."

muted-chat-attempt:
  - "&c&l[!] &eŞu anda susturulmuş durumdasınız! &8(&eKalan: &c{remaining}&8 | &eYetkili: &f{staff}&8)"
  - "&8» &7Sebep: &f{reason}"

# Voice Mute (Simple Voice Chat) Mesajları
voicemute-usage: "&eKullanım: &6/voicemute <oyuncu> [süre/kalici] [sebep]\n&7Örnek: &f/voicemute Steve 1h Mikrofon basma\n&7Örnek: &f/voicemute Steve kalici Hakaret"
voicemute-no-permanent-permission: "&c30 günden uzun veya kalıcı ses susturması uygulamak için &echatutils.voicemute.permanent &cyetkisine sahip olmalısınız! &7(En fazla 30 gün belirtebilirsiniz)"
unvoicemute-usage: "&eKullanım: &6/unvoicemute <oyuncu>"

voicemute-broadcast:
  - "&c&l[VOICE MUTE] &e{target}&7 adlı oyuncu &f{staff} &7tarafından sesli sohbetten &e{duration} &7susturuldu."
  - "&8» &7Sebep: &f{reason}"

unvoicemute-broadcast:
  - "&a&l[VOICE UNMUTE] &e{target}&7 adlı oyuncunun sesli sohbet susturması &f{staff} &7tarafından kaldırıldı."

voicemuted-notify:
  - "&c&l[!] &eSesli sohbetiniz &f{staff} &etarafından &c{duration} &esüreyle susturuldu!"
  - "&8» &7Sebep: &f{reason}"

unvoicemuted-notify:
  - "&a&l[!] &eSesli sohbet susturmanız &f{staff} &etarafından kaldırıldı. Artık konuşabilirsiniz."

voicemuted-attempt:
  - "&c[!] Sesli sohbet susturmanız aktif olduğu için sesiniz iletilmiyor! &8(&eKalan: &c{remaining}&8 | &eYetkili: &f{staff}&8)"
  - "&8» &7Sebep: &f{reason}"

