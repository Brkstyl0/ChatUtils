name: ChatUtils
version: '1.0.0'
main: com.chatutils.ChatUtils
api-version: '1.20'
description: 'ChatUtils'
softdepend: [voicechat, LuckPerms]

commands:
  mute:
    description: Bir oyuncuyu süreli veya kalıcı susturur.
    permission: chatutils.mute
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu> <süre> [sebep]
  unmute:
    description: Bir oyuncunun susturmasını kaldırır.
    permission: chatutils.unmute
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu>
  voicemute:
    description: Bir oyuncuyu sesli sohbetten (Simple Voice Chat) süreli veya kalıcı susturur.
    aliases: [vcmute, vmute]
    permission: chatutils.voicemute
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu> [süre/kalici] [sebep]
  unvoicemute:
    description: Bir oyuncunun sesli sohbet susturmasını kaldırır.
    aliases: [vcunmute, unvmute]
    permission: chatutils.unvoicemute
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu>
  ban:
    description: Bir oyuncuyu sunucudan süreli veya kalıcı olarak yasaklar.
    permission: chatutils.ban
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu> [süre/kalici] [sebep]
  unban:
    description: Bir oyuncunun sunucu yasağını kaldırır.
    permission: chatutils.unban
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu>
  kick:
    description: Bir oyuncuyu sunucudan atar.
    permission: chatutils.kick
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu> [sebep]
  vanish:
    description: İksirsiz ve parçacıksız, TAB ve dünyadan tamamen gizlenen profesyonel görünmezlik.
    aliases: [v]
    permission: chatutils.vanish
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> [on|off|oyuncu]
  disguise:
    description: Oyuncunun skinini, ismini ve LuckPerms rütbesini gizler.
    aliases: [d]
    permission: chatutils.disguise
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <isim> [rank]
  undisguise:
    description: Disguise durumunu kaldırarak orijinal görünüm ve rütbeye döner.
    aliases: [ud, und]
    permission: chatutils.undisguise
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command>
  chat:
    description: Sohbeti kilitler, açar veya durumunu yönetir.
    aliases: [sohbet, chatlock]
    permission: chatutils.chat.toggle
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <kapat|aç|toggle|durum>
  clearchat:
    description: Sohbeti tüm oyuncular için temizler.
    aliases: [cc, sohbettemizle, chatclear]
    permission: chatutils.chat.clear
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command>
  duyuru:
    description: Tüm sunucuya şık formatta ve ses efektli duyuru gönderir.
    permission: chatutils.broadcast
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <mesaj>
  chatutils:
    description: ChatUtils ana yönetim ve yenileme komutu.
    aliases: [cutils]
    permission: chatutils.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> reload
  vcjoin:
    description: Şifreli ve açık Simple Voice Chat ses gruplarına gizli veya görünür katılır.
    aliases: [voicejoin, vcj]
    permission: chatutils.voicechat.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <grup|oyuncu> [--visible]
  vcleave:
    description: Ses grubundan veya gizli dinleme modundan ayrılır.
    aliases: [voiceleave, vcl]
    permission: chatutils.voicechat.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command>
  vcspy:
    description: Şifreli ses gruplarını gizlice (sol üstte gözükmeden) dinler ve konuşma modunu yönetir.
    aliases: [voicespy]
    permission: chatutils.voicechat.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <grup|oyuncu|stop|talk>
  vclist:
    description: Sunucudaki tüm aktif ses gruplarını, şifre durumlarını ve üyelerini listeler.
    aliases: [vcgroups, voicelist, vcg]
    permission: chatutils.voicechat.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command>
  vcmove:
    description: Bir oyuncuyu belirtilen ses grubuna taşır veya gruptan çıkarır.
    aliases: [voicemove]
    permission: chatutils.voicechat.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <oyuncu> <grup|leave>
  vcinfo:
    description: Belirtilen grup veya oyuncu hakkında detaylı ses durumu verir.
    aliases: [voiceinfo]
    permission: chatutils.voicechat.admin
    permission-message: '&c[ChatUtils] Bu komutu kullanmak için yetkiniz yok!'
    usage: /<command> <grup|oyuncu>

permissions:
  chatutils.admin:
    description: Tüm ChatUtils komutlarına tam erişim sağlar.
    default: op
    children:
      chatutils.mute: true
      chatutils.unmute: true
      chatutils.voicemute: true
      chatutils.voicemute.permanent: true
      chatutils.unvoicemute: true
      chatutils.ban: true
      chatutils.ban.permanent: true
      chatutils.unban: true
      chatutils.kick: true
      chatutils.vanish: true
      chatutils.vanish.see: true
      chatutils.vanish.other: true
      chatutils.disguise: true
      chatutils.undisguise: true
      chatutils.chat.toggle: true
      chatutils.chat.clear: true
      chatutils.chat.bypass: true
      chatutils.bypass.kick: true
      chatutils.broadcast: true
      chatutils.socialspy: true
      chatutils.spy: true
      chatutils.reload: true
      chatutils.voicechat.admin: true
      chatutils.vcjoin: true
      chatutils.vcleave: true
      chatutils.vcspy: true
      chatutils.vcgroups: true
      chatutils.vcmove: true
      chatutils.vcinfo: true

  chatutils.voicechat.admin:
    description: Tüm Simple Voice Chat yetkili komutlarına (şifreli gruplara gizli katılma, liste, taşıma vb.) tam erişim sağlar.
    default: op
  chatutils.vcjoin:
    description: /vcjoin komutunu kullanma yetkisi.
    default: op
  chatutils.vcleave:
    description: /vcleave komutunu kullanma yetkisi.
    default: op
  chatutils.vcspy:
    description: /vcspy komutunu kullanma yetkisi.
    default: op
  chatutils.vcgroups:
    description: /vclist (/vcgroups) komutunu kullanma yetkisi.
    default: op
  chatutils.vcmove:
    description: /vcmove komutunu kullanma yetkisi.
    default: op
  chatutils.vcinfo:
    description: /vcinfo komutunu kullanma yetkisi.
    default: op

  chatutils.mute:
    description: /mute komutunu kullanma yetkisi.
    default: op
  chatutils.unmute:
    description: /unmute komutunu kullanma yetkisi.
    default: op
  chatutils.voicemute:
    description: /voicemute komutunu kullanma yetkisi (Maksimum 30 güne kadar süreli susturma).
    default: op
  chatutils.voicemute.permanent:
    description: 30 günden uzun veya kalıcı ses susturması atabilme yetkisi.
    default: op
  chatutils.unvoicemute:
    description: /unvoicemute komutunu kullanma yetkisi.
    default: op
  chatutils.ban:
    description: /ban komutunu kullanma yetkisi (Maksimum 30 güne kadar süreli ban).
    default: op
  chatutils.ban.permanent:
    description: 30 günden uzun veya kalıcı ban atabilme yetkisi.
    default: op
  chatutils.unban:
    description: /unban komutunu kullanma yetkisi.
    default: op
  chatutils.kick:
    description: /kick komutunu kullanma yetkisi.
    default: op
  chatutils.vanish:
    description: /vanish (/v) komutunu kullanma yetkisi.
    default: op
  chatutils.vanish.see:
    description: Görünmez (vanished) yetkilileri görebilme ve TAB listesinde görme yetkisi.
    default: op
  chatutils.vanish.other:
    description: Başka yetkilileri vanish'e alma/çıkarma yetkisi.
    default: op
  chatutils.disguise:
    description: /disguise (/d) komutunu kullanma yetkisi.
    default: op
  chatutils.undisguise:
    description: /undisguise (/ud) komutunu kullanma yetkisi.
    default: op
  chatutils.bypass.kick:
    description: /kick komutundan muaf olma yetkisi.
    default: op
  chatutils.chat.toggle:
    description: /chat kapat ve /chat aç komutlarını kullanma yetkisi.
    default: op
  chatutils.chat.clear:
    description: /clearchat (/cc) komutunu kullanma yetkisi.
    default: op
  chatutils.chat.bypass:
    description: Sohbet kilitliyken veya susturma korumalarında mesaj yazabilme yetkisi.
    default: op
  chatutils.broadcast:
    description: /duyuru komutunu kullanma yetkisi.
    default: op
  chatutils.socialspy:
    description: Oyuncular arasındaki özel mesajlaşmaları (/msg) görme yetkisi.
    default: op
  chatutils.spy:
    description: chatutils.socialspy ile aynı yetki (kısa alias).
    default: op
  chatutils.reload:
    description: /chatutils reload komutunu kullanma yetkisi.
    default: op
