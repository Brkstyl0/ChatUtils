# =================================================== #
#                  CHATUTILS CONFIG                   #
#         Gelişmiş Sohbet ve Ceza Eklentisi           #
# =================================================== #

# Tarih ve saat formatı
date-format: "dd.MM.yyyy HH:mm:ss"

# Duyuru (/duyuru) ayarları
broadcast:
  # Duyuru gönderildiğinde çalınacak ses (Kapatmak için 'NONE' yapabilirsiniz)
  sound: "BLOCK_NOTE_BLOCK_PLING"
  sound-volume: 1.0
  sound-pitch: 1.2
  # Duyuru yapıldığında ekranda Title (Başlık) çıksın mı?
  show-title: true
  title-top: "&6&l⭐ &e&lDUYURU &6&l⭐"
  title-bottom: "&f&l{message}"
  title-fade-in: 10
  title-stay: 100
  title-fade-out: 20

# Sohbet temizleme (/cc) ayarları
clearchat:
  # Sohbette kaç boş satır gönderilsin
  blank-lines: 100
  # Temizlendikten sonra çalınacak ses
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

# Ceza ayarları
punishments:
  # Mute atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-mute: true
  # Unmute atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-unmute: true
  # Voice Mute atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-voicemute: true
  # Unvoicemute atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-unvoicemute: true
  # Ban atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-ban: true
  # Unban atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-unban: true
  # Kick atıldığında tüm sunucuya duyuru geçilsin mi? (true/false)
  broadcast-kick: true
  # Varsayılan susturma süresi (eğer süre girilmezse, örn: 15m)
  default-mute-duration: "15m"
  # Varsayılan sesli susturma süresi
  default-voicemute-duration: "15m"
  # Varsayılan susturma sebebi
  default-mute-reason: "Kurallara uymamak"
  # Varsayılan sesli susturma sebebi
  default-voicemute-reason: "Mikrofonu kötüye kullanmak"
  # Varsayılan yasaklama sebebi
  default-ban-reason: "Sunucu kurallarını ihlal etmek"
  # Varsayılan atılma (kick) sebebi
  default-kick-reason: "Sunucu kurallarını ihlal etmek"

# Tab tamamlama için önerilen varsayılan sebepler
suggested-reasons:
  mute:
    - "Küfür / Argo"
    - "Spam / Flood"
    - "Reklam"
    - "Hakaret"
    - "Ailevi Değerlere Küfür"
    - "Dini / Milli Değerlere Hakaret"
    - "Siyaset"
    - "Yetkiliye Saygısızlık"
    - "Oyun Düzenini Bozma"
    - "Hile İtirafı"
  voicemute:
    - "Mikrofon Basma / Kulak Patlatma"
    - "Seste Küfür / Hakaret"
    - "Rahatsız Edici Ses / Soundpad"
    - "Arka Plan Gürültüsü / Cızırtı"
    - "Seste Reklam"
    - "Yetkiliyi Bölme / Rahatsız Etme"
  ban:
    - "Hile / 3. Parti Yazılım"
    - "Griefing / Yapılara Zarar Verme"
    - "Dolandırıcılık"
    - "Bug / Hata Kötüye Kullanımı"
    - "Ağır Küfür / Hakaret"
    - "Sunucu / Site Reklamı"
    - "Yetkiliyi Yanıltma"
  kick:
    - "Uyarı / Kurallara Uyunuz"
    - "Sohbet Düzenini Bozma"
    - "AFK / Hareketsiz Kalma"
    - "Yetkiliyi Meşgul Etme"
    - "Uygunsuz Davranış"
    - "Spam / Flood"
    - "Hile Şüphesi / Kontrol"
